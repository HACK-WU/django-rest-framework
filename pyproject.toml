[project]
name = "django-rest-framework"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asgiref>=3.8.1",
    "attrs==22.1.0",
    "coreapi==2.3.1",
    "coreschema==0.0.4",
    "django-filter>=25.1",
    "django-guardian>=2.4.0,<2.5",
    "django==5.2",
    "dotenv>=0.9.9",
    "importlib-metadata<5.0",
    "inflection==0.5.1",
    "markdown>=3.3.7",
    "mkdocs==1.6.0",
    "psycopg2-binary>=2.9.5,<2.10",
    "pygments~=2.17.0",
    "pylinkvalidator==0.3",
    "pymysql>=1.1.1",
    "pytest-cov>=4.0.0,<5.0",
    "pytest-django>=4.5.2,<5.0",
    "pytest>=7.0.1,<8.0",
    "pyyaml>=5.3.1,<5.4",
    "setuptools>=78.1.0",
    "sqlparse>=0.5.3",
    "transifex-client>=0.14.4",
    "twine>=3.4.2,<4.0.2",
    "ujson>=5.10.0",
    "wheel>=0.36.2,<0.40.0",
]

# uv包管理工具pip的清华源地址
[[tool.uv.index]]
name = "pypi"
url="https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
